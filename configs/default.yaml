project:
  cache_dir: cache
  annotation_dir: annotations
  seed: 42
  device: mps

ingest:
  ffmpeg_path: ffmpeg
  ffprobe_path: ffprobe
  frame_format: png
  png_compression: 3
  hdr_policy: fail
  verify_cached_checksums: true

detection:
  model_path: models/yolo11x.pt
  image_size: 1280
  confidence_threshold: 0.05
  iou_threshold: 0.70
  max_detections: 50
  batch_size: 1
  half_precision: false

tracking:
  track_high_threshold: 0.25
  track_low_threshold: 0.05
  new_track_threshold: 0.25
  track_buffer: 90
  match_threshold: 0.80
  fuse_score: true
  containment_threshold: 0.90

selection:
  minimum_observations: 30
  minimum_continuity: 0.45
  minimum_score_margin: 0.08
  weights:
    length: 0.25
    continuity: 0.20
    vertical_range: 0.15
    motion: 0.15
    center: 0.15
    image_area: 0.10

pose_crop:
  input_width: 768
  input_height: 1024
  padding_scale: 1.35
  context_window: 91
  smoothing_window: 15
  maximum_interpolation_gap: 5

pose:
  batch_size: 1
  half_precision: false
  flip_tta: true
  multi_scale_tta: [1.0, 1.125]
  postprocess_kernel_size: 11

render:
  ffmpeg_path: ffmpeg
  codec: libx264
  crf: 18
  preset: slow
  line_thickness: 6
  font_scale: 1.2
  show_all_tracks: true

pose_render:
  confidence_threshold: 0.15
  point_radius: 5
  line_thickness: 5
  show_face_keypoints: false
  show_pose_crop: false
  comparison_panel_width: 1080

annotation:
  sample_count: 10
  minimum_spacing_seconds: 0.35
  confidence_threshold: 0.15
  pck_threshold: 0.20
  oks_sigma: 0.10

refine:
  confidence_threshold: 0.15
  confidence_threshold_overrides:
    body: 0.05
    extra: 0.05
    feet: 0.05
    left_hand: 0.08
    right_hand: 0.08
  smoothing_groups: [left_hand, right_hand]
  maximum_interpolation_gap: 5
  one_euro_min_cutoff: 12.0
  one_euro_beta: 0.03
  one_euro_derivative_cutoff: 1.0
  segment_maximum_ratio: 2.5
  outlier_confidence_ceiling: 0.50
  swap_cost_ratio: 0.35
  swap_minimum_jump_scale: 0.20

move_player:
  host: 127.0.0.1
  port: 8765
  lead_in_seconds: 0.25
  lead_out_seconds: 0.25

move_detection:
  position_smoothing_radius: 4
  speed_window_radius: 7
  stable_speed_body_lengths_per_second: 0.18
  start_speed_body_lengths_per_second: 0.45
  minimum_stable_seconds: 0.50
  maximum_stable_gap_seconds: 0.18
  same_hold_radius_body_lengths: 0.12
  minimum_displacement_body_lengths: 0.25
  minimum_move_seconds: 0.10
  maximum_move_seconds: 6.0
  body_motion_quantile: 0.70
  body_stable_speed_body_lengths_per_second: 0.40
  minimum_body_stable_seconds: 0.50
  fall_minimum_drop_body_lengths: 0.50

move_metrics:
  position_smoothing_radius: 4
  speed_window_radius: 7
  minimum_valid_fraction: 0.80

models:
  primary_pose_backend: sapiens2
  yolo11:
    model_id: yolo11x
    checkpoint_filename: yolo11x.pt
    checkpoint_sha256: 7bc158aa95c0ebfdd87f70f01653c1131b93e92522dbe15c228bcd742e773a24
    checkpoint_size_bytes: 114636239
    source_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11x.pt
  sapiens2:
    model_id: facebook/sapiens2-pose-1b
    model_dir: models/sapiens2-pose-1b
    checkpoint_filename: model.safetensors
    checkpoint_sha256: 2dab7014a17e99e460c18817325a71dd7a81ce48d87027f01c2ee7d7b3af969f
    checkpoint_size_bytes: 6079194752
    download_connections: 32
    download_segment_mb: 8
    revision: f5fed8b97b99698d5eea1d14ff0855d0b4c3f000
    keypoint_source_url: https://raw.githubusercontent.com/facebookresearch/sapiens2/7e5bae88456ac418ff0e58e74106c9fe192055d4/sapiens/pose/configs/_base_/keypoints308.py
