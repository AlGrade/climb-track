[project]
name = "climbtrack"
version = "0.1.0"
description = "Offline, reproducible 2D skeleton tracking for climbing videos."
readme = "README.md"
# Upper bound because the pinned ML stack does not publish wheels for 3.13 yet.
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
# Compatible ranges rather than exact pins: `uv.lock` is committed and already
# guarantees byte-identical installs, so pinning here would only block security
# updates. Model reproducibility is pinned where it matters instead - see the
# checksums and revisions in configs/default.yaml.
dependencies = [
    "huggingface-hub>=1.4,<2",
    "lap>=0.5.12,<0.6",
    "matplotlib>=3.11,<4",
    "numpy>=2.1,<3",
    "opencv-python>=5,<6",
    "pyarrow>=18,<23",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=13.9,<15",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "transformers>=5.14,<6",
    "typer>=0.15,<1",
    "ultralytics>=8.4.104,<9",
]

[project.scripts]
climbtrack = "climbtrack.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climbtrack"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires ffmpeg and ffprobe binaries",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
