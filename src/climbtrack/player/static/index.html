<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClimbTrack</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <main class="workspace">
      <section class="video-column" aria-label="Video player">
        <div id="videoShell" class="video-shell">
          <video id="video" preload="auto" playsinline tabindex="0" aria-label="Climbing video"></video>
          <div class="video-label">
            <strong id="activeMove">Full video</strong>
          </div>
          <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-pressed="false"
            aria-label="Switch to portrait layout"
          >
            <span id="layoutToggleIcon" aria-hidden="true">▭</span>
            <span id="layoutToggleLabel">Landscape layout</span>
          </button>
          <div class="video-controls" aria-label="Video controls">
            <button id="videoToggle" class="video-control-button" aria-label="Play video" disabled>▶</button>
            <input id="videoScrubber" class="video-scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Video frame" disabled>
            <span id="videoTime" class="video-time">00:00 / 00:00</span>
            <button id="videoMute" class="video-control-button" aria-label="Mute video" disabled>🔊</button>
          </div>
        </div>

        <section id="metricsCard" class="metrics-card" hidden>
          <div id="speedChartWrap" class="speed-chart">
            <div class="chart-header">
              <strong>Speed per frame</strong>
              <div class="chart-legend" aria-label="Chart legend">
                <span><i class="hand-line"></i>Hand</span>
                <span><i class="body-line"></i>Body</span>
              </div>
            </div>
            <div class="chart-readout" aria-live="polite">
              <span>Hand <strong id="chartHandValue">–</strong></span>
              <span>Body <strong id="chartBodyValue">–</strong></span>
              <span id="chartFrameLabel">Frame –</span>
            </div>
            <svg id="speedChart" viewBox="0 0 760 270" role="img" aria-label="Hand and body speed per video frame">
              <g id="chartGrid"></g>
              <path id="bodySpeedPath" class="chart-path body-path"></path>
              <path id="handSpeedPath" class="chart-path hand-path"></path>
              <line id="chartCursor" class="chart-cursor" x1="58" y1="18" x2="58" y2="224" visibility="hidden"></line>
            </svg>
          </div>

          <div id="metricsGrid" class="metrics-grid">
            <div>
              <span>Hand max</span>
              <strong id="handMaxSpeed">–</strong>
              <small id="handMaxSpeedPx">–</small>
            </div>
            <div>
              <span>Body max</span>
              <strong id="bodyMaxSpeed">–</strong>
              <small id="bodyMaxSpeedPx">–</small>
            </div>
            <div>
              <span>Hand average</span>
              <strong id="handMeanSpeed">–</strong>
              <small id="handPath">–</small>
            </div>
            <div>
              <span>Body average</span>
              <strong id="bodyMeanSpeed">–</strong>
              <small id="bodyPath">–</small>
            </div>
          </div>
          <p id="metricsNote" class="metrics-note"></p>
        </section>
      </section>

      <aside class="side-panel">
        <section id="movesCard" class="moves-card">
          <div id="emptyMoves" class="empty-state">No moves detected.</div>
          <ol id="moveList" class="move-list"></ol>
        </section>

        <div id="transport" class="transport" aria-label="Move navigation">
          <button id="replayMove" class="primary">▶ Play move</button>
          <button id="previousMove" class="secondary">← Previous move</button>
          <button id="nextMove" class="secondary">Next move →</button>
          <button id="playAll" class="ghost">Full video</button>
        </div>

        <details id="editorCard" class="editor-card">
          <summary>Edit boundaries</summary>
          <div class="editor-content">
            <div class="editor-heading">
              <strong id="editorTitle">New move</strong>
              <button id="resetDraft" class="text-button">New</button>
            </div>

            <div class="correction-readout" aria-live="polite">
              <span id="currentTime">00:00.000</span>
              <span>Frame <strong id="currentFrame">–</strong></span>
            </div>

            <div class="frame-controls" aria-label="Frame controls">
              <button id="previousFrame" class="ghost">− 1 Frame</button>
              <button id="nextFrame" class="ghost">+ 1 Frame</button>
            </div>

            <div class="boundary-grid">
              <button id="setStart" class="boundary-button">
                <span>START</span>
                <strong id="startValue">Unset</strong>
              </button>
              <button id="setEnd" class="boundary-button">
                <span>ENDE</span>
                <strong id="endValue">Unset</strong>
              </button>
            </div>

            <fieldset class="hand-picker">
              <legend>Moving hand</legend>
              <div>
                <button type="button" data-hand="left">Left</button>
                <button type="button" data-hand="right">Right</button>
                <button type="button" data-hand="both">Both</button>
              </div>
            </fieldset>

            <div class="editor-actions">
              <button id="saveMove" class="primary wide" disabled>Save</button>
              <button id="deleteMove" class="danger" hidden>Delete</button>
            </div>
            <p class="validation" id="validationMessage" aria-live="polite"></p>
            <div class="save-state" id="saveState" data-state="loading">Loading…</div>
          </div>
        </details>
      </aside>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
